<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <p id="score">Humain 0 - 0 Computer</p>
    <div>
        <button id="rock">rock</button>
        <button id="paper">paper</button>
        <button id="scissors">scissors</button>
    </div>
    <p id="result"></p>

    <script>
        function getComputerChoise() {
            let a = Math.floor(Math.random() * 10) - 1  
            if (a <= 2) {
                return 'paper'
            }
            else if (a <= 5) {
                return 'rock'
            }
            else {
                return 'scissors'
            }
        }

        function getHumainChoise() {
            return prompt("Choose Between Paper,Rock,Scissors")
        }
        function playRound(computerChoise, humainChoise) {
            if (computerChoise === humainChoise) {
                humainScore = humainScore + 1;
                computerScore = computerScore + 1;
                return ("It's Tie")
            }

            if ((computerChoise === 'rock' && humainChoise === 'scissors') || 
            (computerChoise === 'paper' && humainChoise === 'rock') ||
            (computerChoise === 'scissors' && humainChoise === 'paper')) {
                computerScore = computerScore + 1
                return (`You lose ${computerChoise} beat ${humainChoise}`)
            }

            if ((computerChoise === 'scissors' && humainChoise === 'rock') || 
            (computerChoise === 'rock' && humainChoise === 'paper') || 
            (computerChoise === 'paper' && humainChoise === 'scissors')) {
                humainScore = humainScore + 1
                return (`You Won ${humainChoise} beat ${computerChoise}`)
            }

        }
        function playGame(computerChoise, humainChoise) {
            let result = playRound(computerChoise, humainChoise)
            const show = document.getElementById("result")
            show.textContent = result
            const score = document.getElementById("score")
            score.textContent = `Humain ${humainScore} - ${computerScore} Computer`
            if (humainScore == 5) {
            alert("You Won!")
            }
        if (computerScore == 5) {
            alert("You Lose!")
            }
        }

        let humainScore = 0
        let computerScore = 0

        const rock = document.getElementById("rock");
        const paper = document.getElementById("paper");
        const scissors = document.getElementById("scissors");

        
        rock.addEventListener('click', () => playGame(getComputerChoise(), rock.textContent))
        paper.addEventListener('click', () => playGame(getComputerChoise(), paper.textContent))
        scissors.addEventListener('click', () => playGame(getComputerChoise(), scissors.textContent))

    </script>
</body>
</html>
